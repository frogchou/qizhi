protocolVersion: v1
agentId: document-analysis
displayName: 文件内容分析
version: 1.0.0
runtime: codex
entryCommand:
  - ../../node_modules/.bin/tsx
  - src/main.ts
selfCheckCommand: ../../node_modules/.bin/tsx src/self-check.ts
capabilities:
  - name: document.analyze
    description: 读取任务授权的文件，按用户要求总结内容、解释用途并交付完整中文 Markdown 答复和报告；支持文本、Markdown，以及本地可提取文字的 PDF、DOCX、PPTX、XLSX，不支持扫描件 OCR、旧版 Office 或图片分析
